# This configuration represents a fictional SUSE Solution and is meant for example purposes only.
metadata:
  name: "suse-solution"
  version: "4.2.0"
  creationDate: "2026-11-16"
corePlatform:
  # Release manifest OCI image of the Core Platform that this SUSE Solution extends
  image: "registry.suse.com/elemental/rke2/rke2-manifest:1.37"
components:
  systemd:
    extensions:
      - name: "longhorn"
        image: "registry.suse.com/elemental/longhorn:6.28-6.51"
  helm:
    charts:
      - chart: "cert-manager"
        version: "v1.21.3"
        namespace: "cert-manager"
        repository: "jetstack"
        values:
          crds:
            enabled: true
      - chart: "rancher"
        version: "2.16.0"
        namespace: "cattle-system"
        repository: "rancher"
        values:
          replicas: 1
        dependsOn:
          - name: "cert-manager"
            type: "helm"
      - chart: "longhorn-crd"
        version: "110.1.0+up1.12.1"
        namespace: "longhorn-system"
        repository: "rancher-charts"
      - chart: "longhorn"
        version: "110.1.0+up1.12.1"
        namespace: "longhorn-system"
        repository: "rancher-charts"
        dependsOn:
          - name: "longhorn-crd"
            type: "helm"
          - name: "longhorn"
            type: "sysext"
    repositories:
      - name: "jetstack"
        url: "https://charts.jetstack.io"
      - name: "rancher"
        url: "https://releases.rancher.com/server-charts/latest"
      - name: "rancher-charts"
        url: "https://charts.rancher.io"

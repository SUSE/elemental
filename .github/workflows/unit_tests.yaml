name: Unit Tests
on:
  pull_request:
    # Skip changes that no unit test reads. The examples under
    # examples/elemental/customize are validated by the unit tests.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "terraform/**"
      - "examples/elemental/install/**"
      - "examples/elemental/runtime-configs/**"
      - "examples/tools-sysext/**"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
          cache: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rootlesskit
      - name: Run tests
        env:
          COV_THRESHOLD: "70"
        run: |
          # Execute the Unit tests
          make VERBOSE=true ROOTLESSKIT=yes unit-tests

          # Remove mock files from coverage analysis
          sed -n -i '/\/mock\//!p' coverprofile.out
          coverage=$(go tool cover -func=coverprofile.out | grep total | grep -Eo "[0-9]+\.[0-9]+")

          if (( $(echo "${coverage} ${COV_THRESHOLD}" | awk '{print ($1 > $2)}') )); then
            echo "Total Coverage is: ${coverage}%"
          else
            echo "Current test coverage (${coverage}%) is below the threshold (${COV_THRESHOLD}%)."
            echo "Failed"
            exit 1
          fi

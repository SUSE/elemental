---
pr:
  steps:
    - configure_repositories:
        project: devel:UnifiedCore:Tumbleweed:PRs
        repositories:
          - name: standard
            paths:
              - target_project: devel:UnifiedCore:Tumbleweed
                target_repository: standard
            architectures:
              - x86_64
            rebuild: local
            block: local
          - name: containers
            architectures:
              - x86_64
            block: local
    - branch_package:
        source_project: devel:UnifiedCore:Tumbleweed
        source_package: elemental
        target_project: devel:UnifiedCore:Tumbleweed:PRs
    - trigger_services:
        project: devel:UnifiedCore:Tumbleweed
        package: elemental
    - link_package:
        source_project: devel:UnifiedCore:Tumbleweed
        source_package: elemental-base-os
        target_project: devel:UnifiedCore:Tumbleweed:PRs
    - link_package:
        source_project: devel:UnifiedCore:Tumbleweed
        source_package: release-manifest-image
        target_project: devel:UnifiedCore:Tumbleweed:PRs
    - set_flags:
        flags:
          - type: publish
            status: enable
            architecture: x86_64
          - type: build
            status: disable
            architecture: aarch64
  filters:
    event: pull_request
    branches:
      only:
        - main
        - release-3.0
